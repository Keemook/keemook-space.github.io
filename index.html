<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>เกมกระดานอวกาศ - Space Board Game</title>
  <style>
    /* --- 1. สไตล์พื้นฐานและธีมอวกาศ --- */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Kanit', 'Prompt', sans-serif;
    }

    body {
      background-color: #0b0e14;
      background-image: 
        radial-gradient(circle at 50% 50%, rgba(20, 30, 48, 0.6) 0%, rgba(11, 14, 20, 1) 100%),
        radial-gradient(2px 2px at 40px 60px, #fff, rgba(0,0,0,0)),
        radial-gradient(2px 2px at 150px 150px, rgba(255,255,255,0.8), rgba(0,0,0,0)),
        radial-gradient(2px 2px at 300px 80px, rgba(255,255,255,0.6), rgba(0,0,0,0));
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    /* --- 2. หน้าแรก (SETUP SCREEN) --- */
    #setup-screen {
      background: rgba(22, 27, 34, 0.9);
      border: 2px solid #30363d;
      border-radius: 24px;
      padding: 35px;
      width: 100%;
      max-width: 650px;
      box-shadow: 0 0 40px rgba(0, 242, 254, 0.15);
      backdrop-filter: blur(10px);
      text-align: center;
    }

    .setup-title {
      font-size: 2rem;
      font-weight: 800;
      margin-bottom: 8px;
      background: linear-gradient(135deg, #00f2fe 0%, #4facfe 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 0 20px rgba(0, 242, 254, 0.3);
    }

    .setup-subtitle {
      color: #8b949e;
      font-size: 0.95rem;
      margin-bottom: 25px;
    }

    .players-inputs {
      display: flex;
      flex-direction: column;
      gap: 15px;
      margin-bottom: 25px;
    }

    .player-input-card {
      background: #161b22;
      border: 2px solid #30363d;
      border-radius: 16px;
      padding: 15px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
      transition: border-color 0.3s;
    }

    .player-number-tag {
      font-weight: bold;
      font-size: 0.9rem;
      padding: 4px 10px;
      border-radius: 8px;
      white-space: nowrap;
    }

    .name-input {
      flex-grow: 1;
      background: #0d1117;
      border: 1px solid #30363d;
      border-radius: 10px;
      padding: 10px 14px;
      color: #fff;
      font-size: 0.95rem;
      outline: none;
    }

    .name-input:focus {
      border-color: #00f2fe;
    }

    .avatar-picker {
      display: flex;
      gap: 8px;
    }

    .avatar-opt {
      font-size: 1.5rem;
      width: 42px;
      height: 42px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 10px;
      background: #0d1117;
      border: 1px solid #30363d;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .avatar-opt:hover {
      transform: scale(1.1);
    }

    .avatar-opt.selected {
      border-color: #00f2fe;
      background: rgba(0, 242, 254, 0.2);
      box-shadow: 0 0 10px rgba(0, 242, 254, 0.4);
    }

    .setup-actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
    }

    .btn {
      border: none;
      padding: 12px 24px;
      border-radius: 30px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn-add {
      background: #21262d;
      color: #58a6ff;
      border: 1px solid #30363d;
    }

    .btn-add:hover {
      background: #30363d;
      color: #fff;
    }

    .btn-start {
      background: linear-gradient(135deg, #00f2fe 0%, #4facfe 100%);
      color: #000;
      box-shadow: 0 0 20px rgba(0, 242, 254, 0.4);
      flex-grow: 1;
    }

    .btn-start:hover {
      transform: scale(1.03);
      box-shadow: 0 0 25px rgba(0, 242, 254, 0.7);
    }

    /* --- 3. หน้ากระดานเกม (GAME SCREEN) --- */
    #game-screen {
      display: none; /* ซ่อนไว้ก่อน */
      align-items: center;
      justify-content: center;
      gap: 25px;
      max-width: 1250px;
      width: 100%;
    }

    .player-sidebar {
      display: flex;
      flex-direction: column;
      gap: 15px;
      width: 200px;
      flex-shrink: 0;
    }

    .player-card {
      background: rgba(22, 27, 34, 0.85);
      border: 2px solid #30363d;
      border-radius: 16px;
      padding: 16px 12px;
      text-align: center;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(8px);
    }

    .player-card.active-turn {
      box-shadow: 0 0 20px rgba(0, 242, 254, 0.4);
      transform: translateY(-3px);
    }

    .player-avatar {
      font-size: 2.5rem;
      margin-bottom: 6px;
    }

    .player-name {
      display: block;
      font-size: 0.95rem;
      color: #8b949e;
      font-weight: 600;
    }

    .player-money {
      display: block;
      font-size: 1.3rem;
      font-weight: 800;
      color: #ffcc00;
      margin-top: 4px;
    }

    /* กระดานเกมหลัก */
    .board-container {
      background: rgba(15, 20, 28, 0.95);
      border: 2px solid #2d3748;
      border-radius: 20px;
      padding: 15px;
      box-shadow: 0 0 30px rgba(0, 0, 0, 0.8);
      display: grid;
      grid-template-columns: repeat(5, 110px);
      grid-template-rows: repeat(5, 110px);
      gap: 8px;
    }

    .board-center {
      grid-column: 2 / 5;
      grid-row: 2 / 5;
      background: #0d1117;
      border-radius: 12px;
      border: 1px solid #21262d;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 15px;
      text-align: center;
    }

    .turn-indicator {
      background: linear-gradient(90deg, #ff4b5c, #ff758c);
      padding: 6px 16px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: bold;
    }

    .dice-area {
      display: flex;
      gap: 10px;
    }

    .dice {
      width: 42px;
      height: 42px;
      background: #fff;
      color: #000;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.4rem;
      font-weight: bold;
    }

    .roll-btn {
      background: linear-gradient(135deg, #00f2fe 0%, #4facfe 100%);
      color: #000;
      border: none;
      padding: 8px 20px;
      font-size: 0.95rem;
      font-weight: bold;
      border-radius: 25px;
      cursor: pointer;
    }

    /* ช่องกระดาน */
    .tile {
      background: #161b22;
      border: 2px solid #30363d;
      border-radius: 12px;
      padding: 6px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      position: relative;
    }

    .tile.owner-p1 { border-color: #ff4b5c; }
    .tile.owner-p2 { border-color: #00d2ff; }

    .tile-icon {
      font-size: 2rem;
    }

    .tile-name {
      font-size: 0.8rem;
      font-weight: bold;
      color: #e6edf3;
      text-align: center;
    }

    .tile-price {
      font-size: 0.75rem;
      color: #ffcc00;
      font-weight: bold;
    }

    /* ดาว 3D */
    .star-container {
      display: flex;
      gap: 1px;
      min-height: 16px;
    }

    .star-3d {
      font-size: 0.8rem;
      background: linear-gradient(180deg, #ffe600 0%, #ff8800 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0px 2px 0px #804400);
    }
  </style>
</head>
<body>

  <!-- ================= หน้าที่ 1: ตั้งค่าและเพิ่มผู้เล่น ================= -->
  <div id="setup-screen">
    <h1 class="setup-title">🚀 SPACE MONOPOLY</h1>
    <p class="setup-subtitle">กำหนดผู้เล่นและเลือกไอคอนประจำตัว (2 - 4 คน)</p>

    <div class="players-inputs" id="players-container">
      <!-- ผู้เล่นจะถูกสร้างขึ้นด้วย JavaScript ที่นี่ -->
    </div>

    <div class="setup-actions">
      <button class="btn btn-add" id="add-player-btn" onclick="addPlayer()">+ เพิ่มผู้เล่น</button>
      <button class="btn btn-start" onclick="startGame()">เริ่มเกม 🎲</button>
    </div>
  </div>

  <!-- ================= หน้าที่ 2: กระดานเกม ================= -->
  <div id="game-screen">
    <!-- แผงผู้เล่นฝั่งซ้าย (P1, P3) -->
    <div class="player-sidebar" id="sidebar-left"></div>

    <!-- กระดานเกม -->
    <div class="board-container">
      <div class="tile"><span class="tile-name">จุดเริ่มต้น</span><span class="tile-icon">🚩</span><span class="tile-price">+20K</span></div>
      <div class="tile owner-p1">
        <span class="tile-name">ดาวพุธ</span><span class="tile-icon">🪐</span><span class="tile-price">50K</span>
        <div class="star-container"><span class="star-3d">★</span></div>
      </div>
      <div class="tile owner-p2">
        <span class="tile-name">ดาวศุกร์</span><span class="tile-icon">🌕</span><span class="tile-price">60K</span>
        <div class="star-container"><span class="star-3d">★</span><span class="star-3d">★</span></div>
      </div>
      <div class="tile"><span class="tile-name">โลก</span><span class="tile-icon">🌎</span><span class="tile-price">80K</span><div class="star-container"></div></div>
      <div class="tile owner-p1">
        <span class="tile-name">ดวงจันทร์</span><span class="tile-icon">🌙</span><span class="tile-price">90K</span>
        <div class="star-container"><span class="star-3d">★</span><span class="star-3d">★</span><span class="star-3d">★</span></div>
      </div>

      <div class="tile"><span class="tile-name">ดาวอังคาร</span><span class="tile-icon">🔴</span><span class="tile-price">100K</span><div class="star-container"></div></div>

      <!-- ศูนย์กลางกระดาน -->
      <div class="board-center">
        <div class="turn-indicator" id="current-turn-display">ตาของ: -</div>
        <div class="dice-area">
          <div class="dice">⚀</div>
          <div class="dice">⚁</div>
        </div>
        <button class="roll-btn">ทอยลูกเต๋า</button>
      </div>

      <div class="tile"><span class="tile-name">ดาวพฤหัส</span><span class="tile-icon">🪐</span><span class="tile-price">130K</span><div class="star-container"></div></div>
      <div class="tile"><span class="tile-name">ไอโอ</span><span class="tile-icon">🟡</span><span class="tile-price">140K</span><div class="star-container"></div></div>
      <div class="tile"><span class="tile-name">ยูโรปา</span><span class="tile-icon">⚪</span><span class="tile-price">150K</span><div class="star-container"></div></div>

      <div class="tile"><span class="tile-name">สถานีอวกาศ</span><span class="tile-icon">🛰️</span><span class="tile-price">วาป</span></div>
      <div class="tile"><span class="tile-name">ดาวพลูโต</span><span class="tile-icon">❄️</span><span class="tile-price">280K</span><div class="star-container"></div></div>
      <div class="tile"><span class="tile-name">ไทรทัน</span><span class="tile-icon">🔮</span><span class="tile-price">260K</span><div class="star-container"></div></div>
      <div class="tile"><span class="tile-name">ดาวเนปจูน</span><span class="tile-icon">🔵</span><span class="tile-price">250K</span><div class="star-container"></div></div>
      <div class="tile"><span class="tile-name">หลุมดำ</span><span class="tile-icon">🕳️</span><span class="tile-price">ตกเกาะ</span></div>
    </div>

    <!-- แผงผู้เล่นฝั่งขวา (P2, P4) -->
    <div class="player-sidebar" id="sidebar-right"></div>
  </div>

  <script>
    // ไอคอนที่มีให้เลือกแทนตัวผู้เล่น
    const availableIcons = ['🚀', '🛸', '👨‍🚀', '👩‍🚀', '👾', '🤖', '🛰️', '☄️'];
    
    // สีประจำตัวผู้เล่น 1-4
    const playerColors = [
      { border: '#ff4b5c', tagBg: 'rgba(255, 75, 92, 0.2)', tagColor: '#ff4b5c' },
      { border: '#00d2ff', tagBg: 'rgba(0, 210, 255, 0.2)', tagColor: '#00d2ff' },
      { border: '#00e676', tagBg: 'rgba(0, 230, 118, 0.2)', tagColor: '#00e676' },
      { border: '#ffea00', tagBg: 'rgba(255, 234, 0, 0.2)', tagColor: '#ffea00' }
    ];

    // ข้อมูลผู้เล่นเริ่มต้น (2 คน)
    let players = [
      { id: 1, name: 'นักบิน 1', icon: '🚀', money: 500000 },
      { id: 2, name: 'นักบิน 2', icon: '🛸', money: 500000 }
    ];

    // ฟังก์ชัน Render รายชื่อผู้เล่นในหน้า Setup
    function renderSetupPlayers() {
      const container = document.getElementById('players-container');
      container.innerHTML = '';

      players.forEach((p, index) => {
        const color = playerColors[index];
        
        // สร้าง HTML ตัวเลือกไอคอน
        let iconsHtml = availableIcons.map(icon => `
          <div class="avatar-opt ${p.icon === icon ? 'selected' : ''}" 
               onclick="selectIcon(${index}, '${icon}')">
            ${icon}
          </div>
        `).join('');

        const card = document.createElement('div');
        card.className = 'player-input-card';
        card.style.borderColor = p.icon ? color.border : '#30363d';
        
        card.innerHTML = `
          <span class="player-number-tag" style="background: ${color.tagBg}; color: ${color.tagColor};">
            P${p.id}
          </span>
          <input type="text" class="name-input" value="${p.name}" 
                 onchange="updateName(${index}, this.value)" placeholder="ชื่อผู้เล่น">
          <div class="avatar-picker">
            ${iconsHtml}
          </div>
          ${players.length > 2 ? `<button style="background:none; border:none; color:#ff4b5c; cursor:pointer; font-size:1.2rem;" onclick="removePlayer(${index})">✕</button>` : ''}
        `;
        container.appendChild(card);
      });

      // ซ่อนปุ่มเพิ่มถ้าครบ 4 คน
      document.getElementById('add-player-btn').style.display = players.length >= 4 ? 'none' : 'inline-block';
    }

    // เลือกรอบไอคอน
    function selectIcon(playerIndex, icon) {
      players[playerIndex].icon = icon;
      renderSetupPlayers();
    }

    // อัปเดตชื่อผู้เล่น
    function updateName(playerIndex, name) {
      players[playerIndex].name = name || `นักบิน ${playerIndex + 1}`;
    }

    // เพิ่มผู้เล่น (สูงสุด 4 คน)
    function addPlayer() {
      if (players.length < 4) {
        const nextId = players.length + 1;
        const defaultIcon = availableIcons[nextId - 1] || '🤖';
        players.push({
          id: nextId,
          name: `นักบิน ${nextId}`,
          icon: defaultIcon,
          money: 500000
        });
        renderSetupPlayers();
      }
    }

    // ลบผู้เล่น (ขั้นต่ำ 2 คน)
    function removePlayer(index) {
      if (players.length > 2) {
        players.splice(index, 1);
        // รีรัน ID ให้เรียง 1-N ใหม่
        players.forEach((p, i) => p.id = i + 1);
        renderSetupPlayers();
      }
    }

    // กดเริ่มเกม
    function startGame() {
      document.getElementById('setup-screen').style.display = 'none';
      document.getElementById('game-screen').style.display = 'flex';

      const leftSidebar = document.getElementById('sidebar-left');
      const rightSidebar = document.getElementById('sidebar-right');
      leftSidebar.innerHTML = '';
      rightSidebar.innerHTML = '';

      // กระจายผู้เล่นลง Sidebar (P1, P3 ฝั่งซ้าย / P2, P4 ฝั่งขวา)
      players.forEach((p, index) => {
        const color = playerColors[index];
        const playerCardHtml = `
          <div class="player-card ${index === 0 ? 'active-turn' : ''}" style="border-left: 6px solid ${color.border};">
            <div class="player-avatar">${p.icon}</div>
            <span class="player-name">${p.name}</span>
            <span class="player-money">${p.money.toLocaleString()} $</span>
          </div>
        `;

        if (index % 2 === 0) {
          leftSidebar.innerHTML += playerCardHtml;
        } else {
          rightSidebar.innerHTML += playerCardHtml;
        }
      });

      // อัปเดตตัวแสดงตาผู้เล่น
      document.getElementById('current-turn-display').innerHTML = `ตาของ: ${players[0].icon} ${players[0].name}`;
    }

    // แสดงผลครั้งแรก
    renderSetupPlayers();
  </script>
</body>
</html>
