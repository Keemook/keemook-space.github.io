<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>เกมกระดานอวกาศ - Space Board Game</title>
  <style>
    /* --- 1. รีเซ็ตค่าพื้นฐาน และธีมอวกาศ --- */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Kanit', 'Prompt', sans-serif;
    }

    body {
      background-color: #0b0e14;
      background-image: 
        radial-gradient(circle at 50% 50%, rgba(20, 30, 48, 0.5) 0%, rgba(11, 14, 20, 1) 100%),
        radial-gradient(2px 2px at 40px 60px, #fff, rgba(0,0,0,0)),
        radial-gradient(2px 2px at 150px 150px, rgba(255,255,255,0.8), rgba(0,0,0,0)),
        radial-gradient(2px 2px at 300px 80px, rgba(255,255,255,0.6), rgba(0,0,0,0));
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    /* --- 2. เลย์เอาต์หลัก (แยกแผงผู้เล่นอยู่นอกกระดาน) --- */
    .game-layout {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 25px;
      max-width: 1200px;
      width: 100%;
    }

    /* --- 3. แผงแสดงเงินผู้เล่น (Sidebar นอกกระดาน) --- */
    .player-sidebar {
      display: flex;
      flex-direction: column;
      gap: 20px;
      width: 200px;
      flex-shrink: 0;
    }

    .player-card {
      background: rgba(22, 27, 34, 0.85);
      border: 2px solid #30363d;
      border-radius: 16px;
      padding: 20px 15px;
      text-align: center;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(8px);
      transition: all 0.3s ease;
    }

    /* สไตล์เมื่อถึงตาผู้เล่นนั้นๆ */
    .player-card.active-turn {
      border-color: #00f2fe;
      box-shadow: 0 0 20px rgba(0, 242, 254, 0.4);
      transform: translateY(-5px);
    }

    /* สีเอกลักษณ์ของผู้เล่นแต่ละคน */
    .player-card.p1 { border-left: 6px solid #ff4b5c; }
    .player-card.p2 { border-left: 6px solid #00d2ff; }

    .player-avatar {
      font-size: 2.8rem;
      margin-bottom: 8px;
      filter: drop-shadow(0 0 8px rgba(255, 255, 255, 0.3));
    }

    .player-name {
      display: block;
      font-size: 1rem;
      color: #8b949e;
      font-weight: 600;
      margin-bottom: 5px;
    }

    .player-money {
      display: block;
      font-size: 1.4rem;
      font-weight: 800;
      color: #ffcc00;
      text-shadow: 0 0 10px rgba(255, 204, 0, 0.3);
    }

    /* --- 4. โครงสร้างกระดานเกม (Center Board) --- */
    .board-container {
      background: rgba(15, 20, 28, 0.95);
      border: 2px solid #2d3748;
      border-radius: 20px;
      padding: 15px;
      box-shadow: 0 0 30px rgba(0, 0, 0, 0.8);
      display: grid;
      grid-template-columns: repeat(5, 110px);
      grid-template-rows: repeat(5, 110px);
      gap: 8px;
    }

    /* พื้นที่ตรงกลางกระดาน */
    .board-center {
      grid-column: 2 / 5;
      grid-row: 2 / 5;
      background: #0d1117;
      border-radius: 12px;
      border: 1px solid #21262d;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 15px;
      padding: 15px;
      text-align: center;
    }

    .turn-indicator {
      background: linear-gradient(90deg, #ff4b5c, #ff758c);
      padding: 6px 16px;
      border-radius: 20px;
      font-size: 0.9rem;
      font-weight: bold;
    }

    .dice-area {
      display: flex;
      gap: 10px;
    }

    .dice {
      width: 45px;
      height: 45px;
      background: #fff;
      color: #000;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.5rem;
      font-weight: bold;
      box-shadow: inset 0 0 5px rgba(0,0,0,0.2), 0 4px 8px rgba(0,0,0,0.4);
    }

    .roll-btn {
      background: #00f2fe;
      background: linear-gradient(135deg, #00f2fe 0%, #4facfe 100%);
      color: #000;
      border: none;
      padding: 10px 24px;
      font-size: 1rem;
      font-weight: bold;
      border-radius: 25px;
      cursor: pointer;
      box-shadow: 0 0 15px rgba(0, 242, 254, 0.4);
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .roll-btn:hover {
      transform: scale(1.05);
      box-shadow: 0 0 20px rgba(0, 242, 254, 0.7);
    }

    /* --- 5. ช่องเมืองบนกระดาน (Tile) & ปรับขนาดไอคอน --- */
    .tile {
      background: #161b22;
      border: 2px solid #30363d;
      border-radius: 12px;
      padding: 6px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      position: relative;
      overflow: hidden;
      transition: border-color 0.3s;
    }

    /* แสดงความเป็นเจ้าของด้วยสีขอบ */
    .tile.owner-p1 { border-color: #ff4b5c; box-shadow: inset 0 0 10px rgba(255, 75, 92, 0.2); }
    .tile.owner-p2 { border-color: #00d2ff; box-shadow: inset 0 0 10px rgba(0, 210, 255, 0.2); }

    /* ปรับขนาดไอคอนเมืองให้ใหญ่ขึ้น */
    .tile-icon {
      font-size: 2.2rem; /* ขนาดใหญ่ ชัดเจน */
      margin-top: 2px;
      filter: drop-shadow(0 2px 5px rgba(0,0,0,0.5));
    }

    .tile-name {
      font-size: 0.8rem;
      font-weight: bold;
      color: #e6edf3;
      text-align: center;
      line-height: 1.1;
    }

    .tile-price {
      font-size: 0.75rem;
      color: #ffcc00;
      font-weight: bold;
    }

    /* --- 6. ระบบดาว 3D แสดงระดับเมือง (1-4 ดวง) --- */
    .star-container {
      display: flex;
      justify-content: center;
      gap: 1px;
      min-height: 18px;
    }

    .star-3d {
      font-size: 0.85rem;
      display: inline-block;
      /* ทำสี Gradient ให้ดาวดูมีมิติ */
      background: linear-gradient(180deg, #ffe600 0%, #ff8800 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      /* เพิ่มเงาตกกระทบสร้างเอฟเฟกต์ 3D */
      filter: drop-shadow(0px 2px 0px #804400) drop-shadow(0px 2px 3px rgba(0,0,0,0.8));
    }

    /* เอฟเฟกต์พิเศษสำหรับดาวเมืองระดับ 4 (เมืองแลนด์มาร์ก) */
    .level-4 .star-3d {
      filter: drop-shadow(0 0 6px #ff0055) drop-shadow(0px 2px 0px #800022);
      animation: pulseGlow 1.5s infinite alternate;
    }

    @keyframes pulseGlow {
      from { transform: scale(1); }
      to { transform: scale(1.15); }
    }
  </style>
</head>
<body>

  <div class="game-layout">
    
    <!-- แผงแสดงเงินผู้เล่น 1 (นอกกระดาน - ฝั่งซ้าย) -->
    <div class="player-sidebar">
      <div class="player-card p1 active-turn">
        <div class="player-avatar">🚀</div>
        <span class="player-name">นักบิน 1</span>
        <span class="player-money">548,000 $</span>
      </div>
    </div>

    <!-- กระดานเกมหลัก -->
    <div class="board-container">
      
      <!-- แถวบนสุด -->
      <div class="tile">
        <span class="tile-name">จุดเริ่มต้น</span>
        <span class="tile-icon">🚩</span>
        <span class="tile-price">+20K</span>
      </div>

      <div class="tile owner-p1">
        <span class="tile-name">ดาวพุธ</span>
        <span class="tile-icon">🪐</span>
        <span class="tile-price">50K</span>
        <div class="star-container level-1">
          <span class="star-3d">★</span>
        </div>
      </div>

      <div class="tile owner-p2">
        <span class="tile-name">ดาวศุกร์</span>
        <span class="tile-icon">🌕</span>
        <span class="tile-price">60K</span>
        <div class="star-container level-2">
          <span class="star-3d">★</span><span class="star-3d">★</span>
        </div>
      </div>

      <div class="tile">
        <span class="tile-name">โลก</span>
        <span class="tile-icon">🌎</span>
        <span class="tile-price">80K</span>
        <div class="star-container"></div>
      </div>

      <div class="tile owner-p1">
        <span class="tile-name">ดวงจันทร์</span>
        <span class="tile-icon">🌙</span>
        <span class="tile-price">90K</span>
        <div class="star-container level-3">
          <span class="star-3d">★</span><span class="star-3d">★</span><span class="star-3d">★</span>
        </div>
      </div>

      <!-- ฝั่งขวา -->
      <div class="tile owner-p2">
        <span class="tile-name">ดาวอังคาร</span>
        <span class="tile-icon">🔴</span>
        <span class="tile-price">100K</span>
        <div class="star-container level-4">
          <span class="star-3d">★</span><span class="star-3d">★</span><span class="star-3d">★</span><span class="star-3d">★</span>
        </div>
      </div>

      <!-- พื้นที่ตรงกลางกระดาน -->
      <div class="board-center">
        <div class="turn-indicator">ตาของ: 🚀 นักบิน 1</div>
        <div class="dice-area">
          <div class="dice">⚀</div>
          <div class="dice">⚁</div>
        </div>
        <button class="roll-btn">ทอยลูกเต๋า</button>
      </div>

      <div class="tile">
        <span class="tile-name">ดาวพฤหัส</span>
        <span class="tile-icon">🪐</span>
        <span class="tile-price">130K</span>
        <div class="star-container"></div>
      </div>

      <div class="tile">
        <span class="tile-name">ไอโอ</span>
        <span class="tile-icon">🟡</span>
        <span class="tile-price">140K</span>
        <div class="star-container"></div>
      </div>

      <div class="tile owner-p1">
        <span class="tile-name">ยูโรปา</span>
        <span class="tile-icon">⚪</span>
        <span class="tile-price">150K</span>
        <div class="star-container level-2">
          <span class="star-3d">★</span><span class="star-3d">★</span>
        </div>
      </div>

      <!-- แถวล่างสุด -->
      <div class="tile">
        <span class="tile-name">สถานีอวกาศ</span>
        <span class="tile-icon">🛰️</span>
        <span class="tile-price">วาป</span>
      </div>

      <div class="tile">
        <span class="tile-name">ดาวพลูโต</span>
        <span class="tile-icon">❄️</span>
        <span class="tile-price">280K</span>
        <div class="star-container"></div>
      </div>

      <div class="tile">
        <span class="tile-name">ไทรทัน</span>
        <span class="tile-icon">🔮</span>
        <span class="tile-price">260K</span>
        <div class="star-container"></div>
      </div>

      <div class="tile owner-p2">
        <span class="tile-name">ดาวเนปจูน</span>
        <span class="tile-icon">🔵</span>
        <span class="tile-price">250K</span>
        <div class="star-container level-1">
          <span class="star-3d">★</span>
        </div>
      </div>

      <div class="tile">
        <span class="tile-name">หลุมดำ</span>
        <span class="tile-icon">🕳️</span>
        <span class="tile-price">ตกเกาะ</span>
      </div>

    </div>

    <!-- แผงแสดงเงินผู้เล่น 2 (นอกกระดาน - ฝั่งขวา) -->
    <div class="player-sidebar">
      <div class="player-card p2">
        <div class="player-avatar">🛸</div>
        <span class="player-name">นักบิน 2</span>
        <span class="player-money">232,000 $</span>
      </div>
    </div>

  </div>

</body>
</html>
